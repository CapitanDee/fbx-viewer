<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Racetrack 3D Ansicht</title>

  <!-- Google Model Viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
    }
    model-viewer {
      width: 100%;
      height: 70vh;
      background: #222;
      border-radius: 10px;
    }
    #info {
      margin-top: 10px;
      font-size: 0.9rem;
      opacity: 0.8;
      text-align: center;
    }
  </style>
</head>

<body>
  <h1>Racetrack 3D Modell</h1>

  <!-- 3D Modell -->
  <model-viewer id="viewer"
    src="racetrack.glb"
    ar
    ar-modes="scene-viewer webxr"
    alt="3D Racetrack Modell"
    camera-controls
    auto-rotate
    rotation-per-second="20deg"
    shadow-intensity="1"
    exposure="1.2">
  </model-viewer>

  <div id="info">
    Ziehe mit der Maus oder per Touch, um das Modell zu drehen.<br>
    Nutze das Mausrad / Pinch-Geste zum Zoomen.
  </div>
</body>
</html>
